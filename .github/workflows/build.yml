name: Build Muun iOS (sin firmar)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag o commit a compilar (ej: 2.9.2)"
        default: "2.9.2"
        required: true
      devicecheck_off:
        description: "Desactivar DeviceCheck (true o false)"
        default: "true"
        required: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GOPATH: ${{ github.workspace }}/go
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Preparar Rust
        run: |
          rustup update stable || true
          rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim || true
      - name: Mostrar archivos del repo (diagnóstico)
        run: |
          ls
          find . -name makelibs.sh
          ls tools
      - name: Compilar librerías Rust (si existe)
        run: |
          SCRIPT=$(find . -name makelibs.sh | head -n 1)
          if [ -n "$SCRIPT" ]; then
            echo "Encontrado: $SCRIPT"
            chmod +x "$SCRIPT"
            "$SCRIPT"
          else
            echo "No hay makelibs.sh en esta versión, se omite"
          fi
      - name: Instalar gomobile
        run: |
          chmod +x tools/bootstrap-gomobile.sh
          ./tools/bootstrap-gomobile.sh
      - name: Compilar Libwallet (xcframework)
        run: |
          chmod +x tools/libwallet-ios.sh
          ./tools/libwallet-ios.sh
          ls -la falcon/core
      - name: Instalar CocoaPods
        run: |
          cd falcon/app
          pod install
      - name: Script de IP local (solo debug, se omite en Release)
        run: |
          ls -la tools
          if [ ! -f tools/ios-assign-localhost-ip-for-debug.sh ]; then
            echo "Falta el script, se crea uno vacio"
            printf '#!/bin/sh\nexit 0\n' > tools/ios-assign-localhost-ip-for-debug.sh
          fi
          chmod +x tools/ios-assign-localhost-ip-for-debug.sh
      - name: Parche - desactivar CloudKit (Apple ID gratuito no tiene iCloud)
        run: |
          F="falcon/app/falcon/core/Data/Service/CapabilitiesProvider/ICloudCapabilitiesProvider.swift"
          test -f "$F" || { echo "No existe $F"; find falcon -name "ICloudCapabilitiesProvider.swift"; exit 1; }
          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          old = "public func setup() {"
          new = "public func setup() {\n        let icloudDisabled = true\n        if icloudDisabled { return }"
          assert old in s, "No se encontro setup()"
          s = s.replace(old, new, 1)
          open(p, "w").write(s)
          PY
          sed -n 1,30p "$F"
      - name: Parche - usar entorno de produccion (prod) en vez de debug
        run: |
          FILES=$(grep -rl "static let current: Environment = .debug" falcon --include=*.swift || true)
          if [ -z "$FILES" ]; then
            echo "No se encontro la linea del entorno"
            exit 1
          fi
          for f in $FILES; do
            echo "Parcheando: $f"
            sed -i '' 's/static let current: Environment = \.debug/static let current: Environment = .prod/' "$f"
          done
          echo "--- Resultado ---"
          grep -rn "static let current: Environment" falcon --include=*.swift
      - name: Parche - llavero sin grupo de acceso (Apple ID gratuito)
        run: |
          F="falcon/app/falcon/core/Data/KeychainRepository.swift"
          test -f "$F" || { echo "No existe $F"; exit 1; }
          python3 - "$F" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          new, n = re.subn(r",\s*kSecAttrAccessGroup as String: group\]", "]", s, count=1)
          assert n == 1, "No se encontro kSecAttrAccessGroup"
          open(p, "w").write(new)
          PY
          sed -n 25,45p "$F"
      - name: Parche - DeviceCheck no disponible (usar token de respaldo)
        if: ${{ github.event.inputs.devicecheck_off == 'true' }}
        run: |
          python3 - <<'PY'
          import sys
          def patch(path, old, new):
              s = open(path).read()
              assert old in s, "No se encontro en " + path + ": " + old
              open(path, "w").write(s.replace(old, new, 1))
          patch("falcon/app/falcon/AppDelegate.swift",
                "if DCDevice.current.isSupported {",
                "if false && DCDevice.current.isSupported {")
          patch("falcon/app/falcon/core/Data/Service/AppleDeviceCheckAdapter.swift",
                "return DCDevice.current.isSupported",
                "return false")
          PY
          grep -n "isSupported" falcon/app/falcon/AppDelegate.swift falcon/app/falcon/core/Data/Service/AppleDeviceCheckAdapter.swift
      - name: Depuracion - mostrar el error real de sincronizacion en pantalla
        run: |
          python3 - <<'PY'
          import sys

          def patch(path, old, new):
              s = open(path).read()
              assert old in s, "No se encontro en " + path + ": " + old
              open(path, "w").write(s.replace(old, new, 1))

          # 1) Variable global con el ultimo error de sincronizacion
          patch("falcon/app/falcon/Presentation/Screen/Sync/SyncPresenter.swift",
                "import RxSwift",
                "import RxSwift\n\nvar muunLastSyncError: String = \"\"\n\nvar muunLastFailedURL: String = \"\"")
          patch("falcon/app/falcon/Presentation/Screen/Sync/SyncPresenter.swift",
                "delegate.syncFailed()",
                "muunLastSyncError = String(describing: result.error!)\n            delegate.syncFailed()")

          # 1b) Guardar la URL de la peticion que falla
          patch("falcon/app/falcon/core/Data/Service/Base/BaseService.swift",
                "if let someError = self.parseError(data: data, error: error, response: response) {",
                "if let someError = self.parseError(data: data, error: error, response: response) {\n                muunLastFailedURL = response?.url?.absoluteString ?? \"\"")

          # 2) Mostrar el error en una alerta antes de ir a la pantalla de sesion expirada
          patch("falcon/app/falcon/Presentation/Screen/Sync/SyncViewController.swift",
                "navigationController!.setViewControllers([SessionExpiredViewController()], animated: true)",
                '''let muunAlert = UIAlertController(title: "Sync error", message: muunLastSyncError + " | URL: " + muunLastFailedURL, preferredStyle: .alert)
                  muunAlert.addAction(UIAlertAction(title: "OK", style: .default) { _ in
                      self.navigationController!.setViewControllers([SessionExpiredViewController()], animated: true)
                  })
                  self.present(muunAlert, animated: true)''')

          # SwiftLint falla si se supera el umbral de avisos (1196): se desactiva en estos 2 archivos
          for p in ("falcon/app/falcon/Presentation/Screen/Sync/SyncPresenter.swift",
                    "falcon/app/falcon/Presentation/Screen/Sync/SyncViewController.swift",
                    "falcon/app/falcon/core/Data/Service/Base/BaseService.swift"):
              s = open(p).read()
              open(p, "w").write("// swiftlint:disable all\n" + s)
          PY
          grep -n "muunLastSyncError" falcon/app/falcon/Presentation/Screen/Sync/SyncPresenter.swift falcon/app/falcon/Presentation/Screen/Sync/SyncViewController.swift
      - name: Compilar app
        run: |
          WS=$(find falcon/app -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          echo "Workspace: $WS"
          xcodebuild -list -workspace "$WS"
          SCHEME="Muun"
          echo "Scheme: $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Crear IPA
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -n 1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Muun.ipa Payload
      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muun-ipa
          path: Muun.ipa
