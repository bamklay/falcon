name: Build Muun iOS (sin firmar)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag o commit a compilar (ej: 2.9.2)"
        default: "2.9.2"
        required: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GOPATH: ${{ github.workspace }}/go
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Preparar Rust
        run: |
          rustup update stable || true
          rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim || true

      - name: Mostrar script de librerías (para diagnóstico)
        run: |
          ls
          cat libwallet/librs/makelibs.sh || true

      - name: Compilar librerías Rust
        run: |
          chmod +x libwallet/librs/makelibs.sh
          ./libwallet/librs/makelibs.sh

      - name: Instalar gomobile
        run: |
          chmod +x tools/bootstrap-gomobile.sh
          ./tools/bootstrap-gomobile.sh

      - name: Instalar CocoaPods
        run: |
          cd falcon/app
          pod install

      - name: Compilar app
        run: |
          WS=$(find falcon/app -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          echo "Workspace: $WS"
          xcodebuild -list -workspace "$WS"
          SCHEME=$(xcodebuild -list -json -workspace "$WS" | python3 -c "import sys,json; d=json.load(sys.stdin); s=d['workspace']['schemes']; print([x for x in s if 'Pods' not in x][0])")
          echo "Scheme: $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Crear IPA
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -n 1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Muun.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muun-ipa
          path: Muun.ipa
